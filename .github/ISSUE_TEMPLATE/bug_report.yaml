# .github/ISSUE_TEMPLATE/bug_report.yml
name: "🐛 Bug Report"
description: Create a report to help us reproduce and fix a bug.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please fill in as much detail as possible.

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Explain how to trigger the issue step by step.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment / Stage
      options:
        - Local Development
        - Staging
        - Production
    validations:
      required: true

  - type: input
    id: browser-os
    attributes:
      label: Browser & Operating System
      placeholder: e.g., Chrome 127 on macOS Sonoma / Edge on Windows 11
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Console Logs
      description: Paste any error outputs or drop screenshots here.
      render: shell
    validations:
      required: false
