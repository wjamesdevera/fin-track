# .github/ISSUE_TEMPLATE/feature_request.yml
name: "✨ Feature Request"
description: Propose a new feature, enhancement, or UI improvement.
title: "[FEAT]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user friction?
      placeholder: I am frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe what should be built and how it should work.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklists or specific constraints needed to consider this item "Done".
      placeholder: |
        - [ ] Must support dark and light mode
        - [ ] API payload must validate input before saving
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority / Impact
      options:
        - High (Blocks core workflows / key feature)
        - Medium (NICE-to-have improvement)
        - Low (Minor enhancement)
    validations:
      required: true
