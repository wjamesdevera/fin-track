# .github/ISSUE_TEMPLATE/tech_debt.yml
name: "🧹 Technical Debt / Refactor"
description: Suggest code quality, performance, or architectural refactoring.
title: "[CHORE]: "
labels: ["tech-debt", "refactoring"]
body:
  - type: textarea
    id: context
    attributes:
      label: Motivation & Context
      description: Why does this section of code need refactoring or upgrading?
      placeholder: e.g., Unused dependencies, poor test coverage, slow query performance...
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Action Items
      placeholder: |
        - [ ] Refactor legacy module X to hook-based implementation
        - [ ] Add unit test suite to ensure coverage stays >85%
        - [ ] Remove deprecated utility package from package.json
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      options:
        - Small (< 1 day)
        - Medium (1-3 days)
        - Large (Requires design discussion / spike)
